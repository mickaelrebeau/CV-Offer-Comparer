name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build + a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-path .gitignore
      - run: pnpm build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_POSTHOG_PROJECT_TOKEN: phc_ci_dummy
          VITE_POSTHOG_HOST: https://eu.i.posthog.com
      - name: Smoke test (vite preview)
        run: |
          pnpm preview --port 4173 --strictPort &
          for i in $(seq 1 20); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:4173/ | grep -q "Talento"
      - name: Install Chromium (axe-core)
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibility smoke test (axe-core)
        run: |
          pnpm preview --port 4174 --strictPort &
          for i in $(seq 1 20); do
            curl -sf http://localhost:4174/ > /dev/null && break
            sleep 1
          done
          A11Y_BASE_URL=http://localhost:4174 pnpm test:a11y

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: talento_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d talento_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall app main.py
      - name: Run pytest
        env:
          GOOGLE_API_KEY: dummy
          SECRET_KEY: ci-secret
          DATABASE_URL: postgresql://test:test@localhost:5432/talento_test
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/talento_test
        run: pytest -q
