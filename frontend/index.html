  <style>
    /* Démarrage : fond papier immédiat, splash tant que l'app n'est pas montée (#app vide = shell SPA) */
    html, body { background: #F1EEE7; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #F1EEE7; z-index: 200; }
    #splash img { width: 72px; height: 72px; animation: splash-pulse 1.4s ease-in-out infinite; }
    #app:not(:empty) ~ #splash { display: none; }
    @keyframes splash-pulse { 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } }
  </style>
</head>

<body class="bg-background text-foreground antialiased min-h-screen">
  <div id="app"></div>
  <div id="splash" aria-hidden="true"><img src="/icons/icon-192.png" alt="" width="72" height="72" /></div>
  <script type="module" src="/src/main.ts"></script>
</body>
