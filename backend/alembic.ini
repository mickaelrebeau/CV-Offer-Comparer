# Migrations du schéma PostgreSQL (Alembic).
# L'URL de la base vient de DATABASE_URL (app.config), jamais de ce fichier.
#
#   alembic upgrade head                          appliquer les migrations (fait aussi au démarrage de l'API)
#   alembic revision --autogenerate -m "message"  nouvelle migration depuis les modèles
#   alembic downgrade -1                          annuler la dernière migration

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# 0003_add_xxx.py : numéro de révision lisible, ordonné
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
